# Chạy sau phiên mỗi ngày giao dịch: lấy dữ liệu → tín hiệu → tin tức → Telegram → dashboard.
name: daily

on:
  schedule:
    - cron: "20 8 * * 1-5"   # 08:20 UTC = 15:20 giờ VN, thứ Hai–thứ Sáu (GitHub có thể chạy trễ 5–30 phút)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Tải lại toàn bộ lịch sử OHLCV từ 2020-01-01 trước khi chạy"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VNSTOCK_TELEMETRY: "0"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài dependency
        run: python -m pip install -r requirements.txt

      - name: run-daily
        env:
          CAPITAL_VND: ${{ secrets.CAPITAL_VND }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BACKFILL: ${{ inputs.backfill && '--backfill' || '' }}
        run: python -m vnsignal.cli run-daily $BACKFILL

      # Commit cả khi run-daily lỗi giữa chừng, để alert_state/data đã ghi không bị mất (tránh báo trùng).
      - name: Commit data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Không có dữ liệu mới để commit"
          else
            git commit -m "data: cập nhật $(TZ=Asia/Ho_Chi_Minh date '+%Y-%m-%d %H:%M') (giờ VN)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
