timezone: Asia/Ho_Chi_Minh
data_source: VCI
start_date: "2020-01-01"

# Có thể override trọng số riêng từng mã: FPT: {exchange: HOSE, weights: {trend: 2, ...}}
# news_match: regex lọc tin RSS theo mã (tiêu đề + mô tả); news_exclude: cụm từ bỏ đi
# trước khi so khớp (công ty khác trùng tên, ví dụ FPT Retail = mã FRT).
symbols:
  FPT:
    exchange: HOSE
    news_match: ['\bFPT\b']
    news_exclude: [FPT Retail, FPT Shop, Chứng khoán FPT, FPTS]
  ACV:
    exchange: UPCOM
    news_match: ['\bACV\b', 'Cảng [Hh]àng không Việt Nam']
    news_exclude: []
  HVN:
    exchange: HOSE
    news_match: ['\bHVN\b', 'Vietnam Airlines']
    news_exclude: []

# Giờ đóng cửa (giờ VN) và biên độ giá so với giá tham chiếu (close phiên trước).
# Nến của ngày hôm nay chỉ được ghi khi đã qua giờ đóng cửa + eod_buffer_minutes.
exchanges:
  HOSE: {close: "14:45", price_limit: 0.07}
  UPCOM: {close: "15:00", price_limit: 0.15}
eod_buffer_minutes: 15

# Khi eod thấy giá các phiên cũ lệch so với file (giá điều chỉnh do cổ tức/
# chia tách), tải lại toàn bộ lịch sử. Ngưỡng lệch tương đối:
adjustment_tolerance: 0.002

trading:
  lot_size: 100
  buy_fee: 0.0015
  sell_fee: 0.0015
  sell_tax: 0.001
  settlement_days: 2   # mua ngày T, bán được từ phiên chiều T+2

risk:
  atr_period: 14
  stop_atr: 2.0         # stop-loss = entry - 2*ATR
  take_profit_atr: 3.0  # take-profit = entry + 3*ATR
  max_position_pct: 0.35
  risk_per_trade_pct: 0.02

signals:
  weights: {trend: 1.0, momentum: 1.0, volume: 0.5, support_resistance: 1.0}
  buy_threshold: 0.4
  sell_threshold: 0.4
  ema: [20, 50, 200]
  rsi: {period: 14, oversold: 30, overbought: 70}
  macd: {fast: 12, slow: 26, signal: 9}
  volume: {ma: 20, spike: 1.5}
  breakout_window: 20
  cross_lookback: 3     # số phiên coi một lần cắt (EMA/MACD) là "vừa xảy ra"

news:
  rss:
    - {source: CafeF, url: "https://cafef.vn/thi-truong-chung-khoan.rss"}
    - {source: CafeF, url: "https://cafef.vn/doanh-nghiep.rss"}
    - {source: Vietstock, url: "https://vietstock.vn/830/chung-khoan/co-phieu.rss"}
    - {source: Vietstock, url: "https://vietstock.vn/737/doanh-nghiep/hoat-dong-kinh-doanh.rss"}
    - {source: Vietstock, url: "https://vietstock.vn/144/chung-khoan.rss"}
  sentiment_model: claude-haiku-5-5
  sentiment_effort: low   # Haiku 5.5 mặc định bật thinking; chấm điểm là phân loại đơn giản → low
  batch_size: 20          # số tin chấm điểm trong 1 lần gọi API
  window_days: 3          # tin trong N ngày gần nhất (giờ VN) tính vào sentiment hiện tại
  max_confidence_adjust: 10   # sentiment ±1 → confidence ±10 (chỉ là modifier)

backtest:
  in_sample: ["2020-01-01", "2023-12-31"]
  out_of_sample_start: "2024-01-01"
  weight_grid: [0, 0.5, 1, 2]
  threshold_grid: [0.3, 0.4, 0.5]
  min_trades: 5         # bộ trọng số có ít lệnh hơn trong in-sample bị loại
